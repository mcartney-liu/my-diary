name = "mydiary-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[observability]
enabled = true
[observability.logs]
invocation_logs = true
head_sampling_rate = 1

[vars]
# JWT_SECRET 已移除：改由 Cloudflare Dashboard → Workers → Secrets 下发。
# JWT_SECRET_LEGACY 已删除（双密钥过渡已闭环），不要再配置。
# 原因：[vars] 会被 commit 进公开仓库，密钥形态暴露在 git 历史里。

# ====== 生产环境（默认） ======
[[d1_databases]]
binding = "DB"
database_name = "mydiary-db"
database_id = "ed7e7954-5f55-439c-a76a-228f1124512b"

# Workers AI（embedding + LLM 问答）—— 远程端点，边缘节点不支持 llama 系列
[ai]
binding = "AI"
remote = true

# 验证码 KV（5 分钟 TTL 在代码里写）
[[kv_namespaces]]
binding = "verify_codes"
id = "81191d85345e4bde9a9895c530a24d9a"

# 定时任务：
#   "0 4 * * *"  → 演示账号每日重置（UTC 04:00 = 北京时间 12:00）
#   "17 * * * *" → 每小时自动整理「我的生活」知识库里待汇入的日记（见 wiki.js autoIngestLifeKbs）
[triggers]
crons = ["0 4 * * *", "17 * * * *"]

# ====== 测试环境 ======
[env.dev]
name = "mydiary-api-dev"
# env.dev.vars.JWT_SECRET 已移除：同 prod，改由 Dashboard secret 下发

# [triggers] 不会被 env 继承，测试环境需单独声明（见 docs/agent-deploy-dev.md 第2步）
[env.dev.triggers]
crons = ["0 4 * * *", "17 * * * *"]

[[env.dev.d1_databases]]
binding = "DB"
database_name = "mydiary-db-dev"
database_id = "fb45cce8-c051-4f20-a560-ea2dc3cadb26"
remote = true

# Workers AI dev（和 Prod 一致，走 Cloudflare 远程 AI 端点，边缘节点上 llama 系列已下线）
[env.dev.ai]
binding = "AI"
remote = true

[[env.dev.kv_namespaces]]
binding = "verify_codes_dev"
id = "4b8fe160e0044927b62f029d95535c65"
remote = true
